[package]
name = "duckwriter"
version = "1.11.1"
description = "A free word processor that opens and saves Word documents"
authors = ["Duckrice"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "duckwriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
percent-encoding = "2"
serde_json = "1"
tokio = { version = "1.53.3", features = ["net", "sync", "rt", "macros", "time"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }

# Saving as PDF uses WebView2's own PDF printer, spelling Windows' spell checker; the same versions Tauri uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com", "System_UserProfile", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
